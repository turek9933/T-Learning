services:
  t-learning-db:
    image: postgres:17-bookworm
    container_name: t-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - t-learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  t-learning-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: t-learning-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS}
    ports:
      - "${MINIO_PORT:-3012}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - t-learning-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  t-learning-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: t-learning-minio-init
    depends_on:
      t-learning-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: /bin/sh -c "
        mc alias set local http://t-learning-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        mc anonymous set private local/$${MINIO_BUCKET};
        mc mb --ignore-existing local/avatars;
        mc anonymous set public local/avatars;
        echo 'MinIO buckets (${MINIO_BUCKET} and avatars) are ready.';
      "

  t-learning-backend-migrate:
    build:
      context: .
    container_name: t-learning-backend-migrate
    restart: "no"
    depends_on:
      t-learning-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@t-learning-db:5432/${DB_NAME}
    command: ["bun", "drizzle-kit", "migrate"]

  t-learning-backend:
    build:
      context: .
    container_name: t-learning-backend
    restart: unless-stopped
    depends_on:
      t-learning-db:
        condition: service_healthy
      t-learning-minio:
        condition: service_healthy
      t-learning-backend-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0 # override value from .env!
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@t-learning-db:5432/${DB_NAME}
      MINIO_ENDPOINT: http://t-learning-minio:9000
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  t-learning-db-data:
  t-learning-minio-data: